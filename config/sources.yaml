dataset:
  name: indian-tts-youtube-curated-60min
  target_total_minutes: 60
  buckets:
    indian_english:
      language_code: en-IN
      language_name: Indian English
      target_minutes: 30
    hindi:
      language_code: hi-IN
      language_name: Hindi
      target_minutes: 30

quality:
  min_segment_seconds: 20
  max_segment_seconds: 70
  target_sample_rate: 16000
  target_channels: 1

# INSTRUCTIONS FOR FINDING GOOD SOURCES:
# 1. Search YouTube for:
#    Indian English: "TEDx India", "Indian podcast interview", "NDTV English news anchor", "Indian English storytelling"
#    Hindi: "Hindi news anchor", "Hindi podcast", "Hindi storytelling", "Hindi narration", "Hindi vlog"
#
# 2. Look for videos with:
#    - Single speaker (no overlapping voices)
#    - Clear audio (no background music during speech)
#    - Natural speech (not heavily scripted/robotic)
#    - Sections of 30-60 seconds continuous speech
#
# 3. For each video:
#    - Listen to find 3-5 clean segments
#    - Note the exact timestamps (start/end)
#    - Avoid intro music, applause, audience questions
#
# 4. Replace the example URLs below with your actual findings

