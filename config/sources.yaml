# QUICK START GUIDE:
#
# 1. Find 4-6 good YouTube videos (mix of Indian English and Hindi)
# 2. For EACH video:
#    - Watch and listen carefully
#    - Find 3-5 clean 30-60 second segments
#    - Note exact timestamps
#    - Replace the REPLACE_WITH_ACTUAL_VIDEO_ID with the real YouTube ID
#
# 3. Aim for variety:
#    - Different speakers
#    - Different emotions (neutral, happy, serious, calm, excited)
#    - Different styles (formal, conversational, news, narration)
#
# 4. Quality checklist for each segment:
#    ✓ Single speaker only
#    ✓ No background music during speech
#    ✓ No applause, crowd noise, or overlapping voices
#    ✓ Clear, natural speech
#    ✓ Segment doesn't cut off words at start/end
#
# 5. After filling this file, run:
#    source .venv/bin/activate
#    tts-curate download --manifest config/sources.yaml
