[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indian-tts-dataset-curation"
version = "0.1.0"
description = "Manifest-driven curation pipeline for a 60-minute Indian TTS training dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "datasets[audio]>=2.20.0",
  "huggingface_hub>=0.23.0",
  "markdown>=3.6",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "pyyaml>=6.0.1",
  "requests>=2.32.0",
  "rich>=13.7.0",
  "sarvamai>=0.1.0",
  "soundfile>=0.12.1",
  "weasyprint>=62.0",
  "yt-dlp>=2024.5.27"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0"
]

[project.scripts]
tts-curate = "tts_curation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
